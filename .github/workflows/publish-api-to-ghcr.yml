name: Publish API to GHCR

on:
  push:
    branches: [main]
    paths:
      - 'src/MechanicShop.Api/**'
      - 'src/MechanicShop.Application/**'
      - 'src/MechanicShop.Domain/**'
      - 'src/MechanicShop.Infrastructure/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/publish-api-to-ghcr.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repo name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/MechanicShop.Api/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}/mechanic-shop-api:latest
