name: Publish Client to GHCR

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
    paths:
      - 'src/MechanicsShop.Client/**'
      - '.github/workflows/publish-client-to-ghcr.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repo name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: src/MechanicsShop.Client
          file: src/MechanicsShop.Client/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/mechanic-shop-client:latest
            ghcr.io/${{ env.REPO_LOWER }}/mechanic-shop-client:${{ github.sha }}

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: mechanic-shop-client
          resourceGroup: mechanic-shop-rg
          imageToDeploy: ghcr.io/${{ env.REPO_LOWER }}/mechanic-shop-client:${{ github.sha }}
